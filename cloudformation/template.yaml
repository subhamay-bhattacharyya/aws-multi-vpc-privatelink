Outputs:

  VpcId:
    Description: "ID of the VPC created by the nested stack"
    Value: !GetAtt VpcANestedStack.Outputs.VPCId

  InternetGatewayId:
    Description: "ID of the Internet Gateway attached to the VPC created by the nested stack"
    Value: !GetAtt VpcANestedStack.Outputs.InternetGatewayId

  PublicSubnet1Id:
    Description: "ID of public subnet 1 created by the nested subnets stack"
    Value: !GetAtt PublicSubnetsVpcANestedStack.Outputs.SubnetId1

  PublicSubnet1Arn:
    Description: "ARN of public subnet 1 created by the nested subnets stack"
    Value: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${PublicSubnetsVpcANestedStack.Outputs.SubnetId1}"

  PublicSubnet2Id:
    Description: "ID of public subnet 2 created by the nested subnets stack"
    Value: !GetAtt PublicSubnetsVpcANestedStack.Outputs.SubnetId2

  PublicSubnet2Arn:
    Description: "ARN of public subnet 2 created by the nested subnets stack"
    Value: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${PublicSubnetsVpcANestedStack.Outputs.SubnetId2}"

  VpcBId:
    Description: "ID of VPC B created by the nested stack"
    Value: !GetAtt VpcBNestedStack.Outputs.VPCId

  VpcBInternetGatewayId:
    Description: "ID of the Internet Gateway attached to VPC B created by the nested stack"
    Value: !GetAtt VpcBNestedStack.Outputs.InternetGatewayId

  VpcBPublicSubnet1Id:
    Description: "ID of VPC B public subnet 1 created by the nested subnets stack"
    Value: !GetAtt PublicSubnetsVpcBNestedStack.Outputs.SubnetId1

  VpcBPublicSubnet1Arn:
    Description: "ARN of VPC B public subnet 1 created by the nested subnets stack"
    Value: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${PublicSubnetsVpcBNestedStack.Outputs.SubnetId1}"

  VpcBPublicSubnet2Id:
    Description: "ID of VPC B public subnet 2 created by the nested subnets stack"
    Value: !GetAtt PublicSubnetsVpcBNestedStack.Outputs.SubnetId2

  VpcBPublicSubnet2Arn:
    Description: "ARN of VPC B public subnet 2 created by the nested subnets stack"
    Value: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${PublicSubnetsVpcBNestedStack.Outputs.SubnetId2}"

  VpcCId:
    Description: "ID of VPC C created by the nested stack"
    Value: !GetAtt VpcCNestedStack.Outputs.VPCId

  VpcCInternetGatewayId:
    Description: "ID of the Internet Gateway attached to VPC C created by the nested stack"
    Value: !GetAtt VpcCNestedStack.Outputs.InternetGatewayId

  VpcCPublicSubnet1Id:
    Description: "ID of VPC C public subnet 1 created by the nested subnets stack"
    Value: !GetAtt PublicSubnetsVpcCNestedStack.Outputs.SubnetId1

  VpcCPublicSubnet1Arn:
    Description: "ARN of VPC C public subnet 1 created by the nested subnets stack"
    Value: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${PublicSubnetsVpcCNestedStack.Outputs.SubnetId1}"

  VpcCPublicSubnet2Id:
